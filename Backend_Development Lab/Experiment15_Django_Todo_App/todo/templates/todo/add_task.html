<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f6f8; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 8px 16px; background: #1e3a5f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add a New Task</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Enter task..." required>
            <button type="submit">Save Task</button>
            <a href="{% url 'task_list' %}" style="margin-left:10px;">Cancel</a>
        </form>
    </div>
</body>
</html>
