<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f6f8; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .done { text-decoration: line-through; color: gray; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        a { text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>My To-Do List</h1>
        <p><a href="{% url 'add_task' %}">+ Add New Task</a></p>
        <ul>
            {% for task in tasks %}
                <li>
                    <span class="{% if task.completed %}done{% endif %}">{{ task.title }}</span>
                    <span>
                        <a href="{% url 'toggle_task' task.id %}">{% if task.completed %}Undo{% else %}Complete{% endif %}</a>
                        <a href="{% url 'delete_task' task.id %}" style="color:red;">Delete</a>
                    </span>
                </li>
            {% empty %}
                <li>No tasks yet!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
